import org.slf4j.event.Level

import java.nio.charset.StandardCharsets
import java.nio.file.FileSystemException
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = 'EnvyWare'
        url = 'https://maven.envyware.co.uk/releases'
        content {
            includeGroup 'com.envyware.minecraftmcp'
        }
    }
    ivy {
        setUrl('https://download.nodecdn.net/containers/reforged/universal/release')

        metadataSources {
            artifact()
            gradleMetadata()
        }
        patternLayout {
            artifact('[artifact].[ext]')
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

java {
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')

            systemProperty 'minecraftMcp.background', 'true'
            systemProperty 'minecraftMcp.port', '25599'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime

    mcpBridge {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation("pixelmon:Pixelmon-${minecraft_version}-${pixelmon_version}-universal:${pixelmon_version}")
    interfaceInjectionData("pixelmon:Pixelmon-${minecraft_version}-${pixelmon_version}-universal-interfaceinjection:${pixelmon_version}@json")

    compileOnly("com.envyware.minecraftmcp:minecraft_mcp-neoforge:${minecraft_mcp_version}")
    localRuntime("com.envyware.minecraftmcp:minecraft_mcp-neoforge:${minecraft_mcp_version}")

    mcpBridge("com.envyware.minecraftmcp:minecraft_mcp-bridge:${minecraft_mcp_version}")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            pixelmon_version           : pixelmon_version,
            pixelmon_version_range     : pixelmon_version_range,
            minecraft_mcp_version      : minecraft_mcp_version,
            minecraft_mcp_version_range: minecraft_mcp_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'com/envyware/pixelmonmcp/build.properties']) {
        expand replaceProperties
    }
}

def clientRunDir = neoForge.runs.client.gameDirectory.get().asFile
def bridgeTarget = file('runs/mcp-bridge.jar')
def bridgeFiles = configurations.mcpBridge

def prepareMcpBridge = tasks.register('prepareMcpBridge') {
    group = 'pixelmon mcp'
    description = 'Copies the minecraft-mcp stdio bridge to runs/mcp-bridge.jar.'
    inputs.files(bridgeFiles)
    outputs.upToDateWhen { false }
    doLast { task ->
        def source = bridgeFiles.singleFile.toPath()
        def target = bridgeTarget.toPath()
        if (Files.exists(target) && Files.mismatch(source, target) == -1L) {
            return
        }
        Files.createDirectories(target.parent)
        try {
            Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING)
        } catch (FileSystemException e) {
            task.logger.warn("runs/mcp-bridge.jar is in use by a running bridge and was not updated: ${e.message}")
        }
    }
}

def seedClientRun = tasks.register('seedClientRun') {
    group = 'pixelmon mcp'
    description = 'Disables the early loading window and seeds options.txt for the background client run.'
    dependsOn prepareMcpBridge
    outputs.upToDateWhen { false }
    doLast {
        def utf8 = StandardCharsets.UTF_8
        def fmlToml = new File(clientRunDir, 'config/fml.toml')
        fmlToml.parentFile.mkdirs()
        def text = fmlToml.exists() ? new String(Files.readAllBytes(fmlToml.toPath()), utf8) : ''
        if (!text.isEmpty() && text.charAt(0) == (char) 0xFEFF) {
            text = text.substring(1)
        }
        if (text =~ /(?m)^earlyWindowControl\s*=/) {
            text = text.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
        } else {
            text = (text.isEmpty() || text.endsWith('\n') ? text : text + '\n') + 'earlyWindowControl = false\n'
        }
        Files.write(fmlToml.toPath(), text.getBytes(utf8))

        def options = new File(clientRunDir, 'options.txt')
        if (!options.exists()) {
            def lines = [
                    'onboardAccessibility:false',
                    'overrideWidth:1600',
                    'overrideHeight:900',
                    'guiScale:2',
                    'maxFps:30'
            ]
            Files.write(options.toPath(), (lines.join('\n') + '\n').getBytes(utf8))
        }
    }
}

tasks.matching { it.name == 'prepareClientRun' }.configureEach {
    dependsOn seedClientRun
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            artifact jar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = 'EnvyWare'
            url = 'https://maven.envyware.co.uk/releases'
            credentials {
                username = findProperty('envywareUsername')
                password = findProperty('envywarePassword')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
