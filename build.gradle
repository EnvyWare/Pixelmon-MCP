plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = 'EnvyWare'
        url = 'https://maven.envyware.co.uk/releases'
        content {
            includeGroup 'com.envyware.minecraftmcp'
        }
    }
    ivy {
        setUrl('https://download.nodecdn.net/containers/reforged/universal/release')

        metadataSources {
            artifact()
            gradleMetadata()
        }
        patternLayout {
            artifact('[artifact].[ext]')
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')

            // minecraft-mcp in background mode: hidden window, no focus or mouse grab, fixed endpoint port
            systemProperty 'minecraftMcp.background', 'true'
            systemProperty 'minecraftMcp.port', '25599'
        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime

    // The minecraft-mcp stdio bridge, copied to runs/mcp-bridge.jar for agents
    mcpBridge {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation("pixelmon:Pixelmon-${minecraft_version}-${pixelmon_version}-universal:${pixelmon_version}")
    interfaceInjectionData("pixelmon:Pixelmon-${minecraft_version}-${pixelmon_version}-universal-interfaceinjection:${pixelmon_version}@json")

    // minecraft-mcp is provided by the game: compile against it, load it in the dev client, never bundle or publish it
    compileOnly("com.envyware.minecraftmcp:minecraft_mcp-neoforge:${minecraft_mcp_version}")
    localRuntime("com.envyware.minecraftmcp:minecraft_mcp-neoforge:${minecraft_mcp_version}")

    mcpBridge("com.envyware.minecraftmcp:minecraft_mcp-bridge:${minecraft_mcp_version}")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            pixelmon_version           : pixelmon_version,
            pixelmon_version_range     : pixelmon_version_range,
            minecraft_mcp_version      : minecraft_mcp_version,
            minecraft_mcp_version_range: minecraft_mcp_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'com/envyware/pixelmonmcp/build.properties']) {
        expand replaceProperties
    }
}

// Seeds the client run's game directory for background mode and copies the bridge next to it.
// Everything the task actions use is captured here, so they never touch `project` (configuration cache).
def clientRunDir = neoForge.runs.client.gameDirectory.get().asFile
def bridgeTarget = file('runs/mcp-bridge.jar')
def bridgeFiles = configurations.mcpBridge

def prepareMcpBridge = tasks.register('prepareMcpBridge') {
    group = 'pixelmon mcp'
    description = 'Copies the minecraft-mcp stdio bridge to runs/mcp-bridge.jar.'
    inputs.files(bridgeFiles)
    outputs.upToDateWhen { false }
    doLast { task ->
        def source = bridgeFiles.singleFile.toPath()
        def target = bridgeTarget.toPath()
        if (java.nio.file.Files.exists(target) && java.nio.file.Files.mismatch(source, target) == -1L) {
            return
        }
        java.nio.file.Files.createDirectories(target.parent)
        try {
            java.nio.file.Files.copy(source, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } catch (java.nio.file.FileSystemException e) {
            task.logger.warn("runs/mcp-bridge.jar is in use by a running bridge and was not updated: ${e.message}")
        }
    }
}

def seedClientRun = tasks.register('seedClientRun') {
    group = 'pixelmon mcp'
    description = 'Disables the early loading window and seeds options.txt for the background client run.'
    dependsOn prepareMcpBridge
    outputs.upToDateWhen { false }
    doLast {
        def utf8 = java.nio.charset.StandardCharsets.UTF_8
        def fmlToml = new File(clientRunDir, 'config/fml.toml')
        fmlToml.parentFile.mkdirs()
        def text = fmlToml.exists() ? new String(java.nio.file.Files.readAllBytes(fmlToml.toPath()), utf8) : ''
        if (!text.isEmpty() && text.charAt(0) == (char) 0xFEFF) {
            text = text.substring(1)
        }
        if (text =~ /(?m)^earlyWindowControl\s*=/) {
            text = text.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
        } else {
            text = (text.isEmpty() || text.endsWith('\n') ? text : text + '\n') + 'earlyWindowControl = false\n'
        }
        java.nio.file.Files.write(fmlToml.toPath(), text.getBytes(utf8))

        def options = new File(clientRunDir, 'options.txt')
        if (!options.exists()) {
            def lines = [
                    'onboardAccessibility:false',
                    'overrideWidth:1600',
                    'overrideHeight:900',
                    'guiScale:2',
                    'maxFps:30'
            ]
            java.nio.file.Files.write(options.toPath(), (lines.join('\n') + '\n').getBytes(utf8))
        }
    }
}

tasks.matching { it.name == 'prepareClientRun' }.configureEach {
    dependsOn seedClientRun
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
